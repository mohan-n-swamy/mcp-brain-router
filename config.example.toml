# Optional TypeSafe Jev credential file (no secret value).
# jev_key_file = "/absolute/path/to/typesafe-key"
# mcp-brain-router Configuration Example
#
# DO NOT COMMIT YOUR REAL CONFIG.
# The installer creates ~/.config/mcp-brain-router/config.toml with chmod 0600.
#
# API keys are stored securely (user-read-only, 0600 permissions).
# Never check real keys into git — only this example template.

# DeepSeek API key (deepseek-v4-pro in the worker role; unkeyed means skipped)
deepseek_key = "sk-xxxxxxxxxxxxx"

# Data class a delegate call gets when the caller names none. "orange" (the
# Orange host's default) reaches Claude only and refuses rather than falls through.
# default_class = "personal"

# Codex CLI availability (role cascades + complexity=adversarial)
# Set to true only if 'codex' binary is installed and on PATH
codex_enabled = false

# Grok CLI availability (xAI coding provider for role-based worker cascades)
# Set to true only if 'grok' binary is installed and on PATH. No API key: grok
# authenticates via `grok login` (grok.com), so there is no grok_key field.
grok_enabled = false

# Kimi CLI availability (volume lead on worker/simple; mid cascade on thinker/adversary)
# Set to true only if 'kimi' binary is installed and on PATH. OAuth via kimi login.
kimi_enabled = false

# Apple's on-device fm model, reached over ssh (host with `fm license` agreed).
# Setting it enables the "apple-fm" candidate; put it first in simple only.
# fm_host = "mini"

# Headroom proxy base URL (optional) — only matters for the DeepSeek HTTP path
# Leave commented to use direct API calls
# headroom_base_url = "http://localhost:8282"

# Model override for the adversarial tier (optional; default gpt-6.1-sol, the
# only model the ChatGPT login accepts).
[model_overrides]
# adversarial = "gpt-6.1-sol"

# Role orders are not set here: they live in the repo (config.DEFAULT_ROLES),
# where the retired-model scan sees them. A [roles] table is ignored.
